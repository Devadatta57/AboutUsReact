/* ---------- file save (downloads capability first, then anchor) ---------- */
async function saveFile(name,blob){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(dl){
        try{await dl.save({filename:name,data:blob});toast('ఫైల్ సేవ్ చేయబడింది: '+name,'ok');return'cap'}
        catch(e){
          if(e&&e.code==='declined'){toast('సేవ్ రద్దు చేయబడింది');return'declined'}
          toast('ఫైల్ సేవ్ కాలేదు ('+(e&&e.code||'లోపం')+')','bad');return'error';
        }
      }
    }
  }catch(e){}
  try{
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);toast('ఫైల్ డౌన్‌లోడ్ అయింది: '+name,'ok');return'anchor';
  }catch(e){toast('డౌన్‌లోడ్ సాధ్యం కాలేదు','bad');return'error'}
}

function validateRec(d,ctx){

  if(T(d.cat)&&!E.cat){if(!CATMAP[T(d.cat)]||!canSeeCat(u,T(d.cat)))E.cat='category code చెల్లదు లేదా మీకు అనుమతి లేదు'}

  if(T(d.phone)&&!E.phone){const p=T(d.phone).replace(/[\s\-]/g,'');if(!/^\d{10}$/.test(p))E.phone='సరిగ్గా 10 అంకెలు ఉండాలి'}

  if(T(d.website)&&!/^(https?:\/\/)?[^\s\/.]+(\.[^\s\/.]+)+(\/\S*)?$/.test(T(d.website)))E.website='వెబ్ చిరునామా ఫార్మాట్ సరిగా లేదు';
  if(T(d.status)&&!S.settings.pipeline.some(p=>p.id===T(d.status)))E.status='చెల్లని స్థితి';

  });
  return E;
}
function findDup(d,ignoreId){
  const n=norm(d.name),st=norm(d.state),ph=digits(d.phone).slice(-10);
  for(const r of S.recs){
    if(r.id===ignoreId)continue;
    if(n&&st&&norm(r.name)===n&&norm(r.state)===st)return{rec:r,why:'అదే పేరు + అదే రాష్ట్రం'};
    if(ph.length===10&&digits(r.phone).slice(-10)===ph)return{rec:r,why:'అదే ఫోన్ నంబర్'};
  }
  return null;
}
function mkTags(tags,user,prev){

}

function filterRecs(u){
  const f=UI.rf;const q=norm(f.q);let rs=scopedRecs(u);
  rs=rs.filter(r=>{
    const c=cinfo(r.cat);
    if(q&&!(norm(r.name).includes(q)||norm(r.id).includes(q)||norm(r.contact).includes(q)||digits(r.phone).includes(digits(q))&&digits(q)||norm(r.district).includes(q)))return false;
    if(f.div&&c.div!==f.div)return false;
    if(f.cat&&r.cat!==f.cat)return false;
    if(f.st&&String(c.st)!==String(f.st))return false;
    if(f.tm&&String(c.tm)!==String(f.tm))return false;
    if(f.state&&r.state!==f.state)return false;
    if(f.status&&r.status!==f.status)return false;
    if(f.owner&&r.owner!==f.owner)return false;
    if(f.wf&&r.wf!==f.wf)return false;
    if(f.stale&&!(daysSince(r.updatedAt)>S.settings.staleDays))return false;
    return true;
  });
  return rs.sort((a,b)=>a.updatedAt<b.updatedAt?1:-1);
}

/* ---------- entry form ---------- */
function fld(label,req,inner,err,hint){return '<div class="field '+(err?'bad':'')+'"><label>'+label+(req?' <span class="req">★</span>':'')+'</label>'+inner+(err?'<div class="err">'+esc(err)+'</div>':'')+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>'}
function formDefaults(u,p){
  if(p.edit){const r=S.recs.find(x=>x.id===p.edit);if(r)return Object.assign({},r,{tags:(r.tags||[]).map(t=>({cat:t.cat,evidence:t.evidence,st:t.st}))})}
  const cat=p.cat||'';const c=cat&&CATMAP[cat]&&canSeeCat(u,cat)?cinfo(cat):null;
  return{name:'',cat:c?cat:'',state:'',district:'',contact:'',desig:'',phone:'',email:'',website:'',address:'',status:S.settings.pipeline[0].id,owner:'',lastContact:'',nextAction:'',nextDue:'',nexus:c?c.nexus:'',source:'',notes:'',tags:[]};
}
function ownerChoices(cat){const dv=cat&&CATMAP[cat]?CATMAP[cat].div:null;return S.users.filter(x=>x.active&&(!dv||isSuper(x)||(x.divs||[]).includes(dv)))}
function recForm(u){
  const p=UI.p;const edit=p.edit?S.recs.find(x=>x.id===p.edit):null;

  if(!p.form)p.form={d:formDefaults(u,p),errs:{},dup:null};
  const F=p.form,d=F.d,E=F.errs||{};
  if(!d.owner){const oc=ownerChoices(d.cat);d.owner=oc.some(x=>x.id===u.id)?u.id:(oc[0]?oc[0].id:'')}
  const tg=d.tags||[];const nerr=Object.keys(E).length;
  let h=pageHead(edit?'రికార్డ్ సవరణ — '+edit.id:'కొత్త ఎంట్రీ',edit?'':'★ గుర్తు ఉన్న 13 ఫీల్డ్‌లు తప్పనిసరి. ఒక సంస్థ = ఒకే రికార్డ్ (ఒకే Home category).');

function readForm(f){
  const g=n=>f.elements[n]?String(f.elements[n].value||'').trim():'';
  const d={};['name','cat','state','district','contact','desig','phone','email','website','address','status','owner','lastContact','nextAction','nextDue','nexus','source','notes'].forEach(k=>d[k]=g(k));
  d.tags=[];[1,2].forEach(i=>{if(g('tag'+i)||g('ev'+i)){d.tags.push({cat:g('tag'+i),evidence:g('ev'+i)})}});
  return d;
}
INP.formcat=(el)=>{
  const f=el.form;const d=readForm(f);const old=UI.p.form&&UI.p.form.d?UI.p.form.d.cat:'';
  const prevNex=old&&CATMAP[old]?cinfo(old).nexus:'';
  if(d.cat&&CATMAP[d.cat]&&(!d.nexus||d.nexus===prevNex))d.nexus=cinfo(d.cat).nexus;
  if(d.owner){const oc=ownerChoices(d.cat);if(!oc.some(x=>x.id===d.owner))d.owner=''}
  UI.p.form={d,errs:{},dup:null};render();
};
INP.dupchk=(el)=>{
  const f=el.form;const d=readForm(f);const hit=(d.name&&d.state||digits(d.phone).length>=10)?findDup(Object.assign({},d),UI.p.edit||null):null;
  const nameStateOnly=hit&&hit.why.indexOf('పేరు')>=0&&!d.state;
  const box=$('#dupbox');if(!box)return;
  box.className=hit?'note warn':'';box.innerHTML=hit&&!nameStateOnly?'<b>హెచ్చరిక — డూప్లికేట్ ఉండవచ్చు</b> ('+esc(hit.why)+'): <a href="#" data-act="rec-open" data-id="'+hit.rec.id+'"><b>'+hit.rec.id+' · '+esc(hit.rec.name)+'</b></a>. సేవ్ సమయంలో ఇది బ్లాక్ అవుతుంది.':'';
};
ACT['form-cancel']=()=>{const e=UI.p.edit;e?go('rec','list',{id:e}):go('rec','list')};
FRM.recform=(f,e)=>{
  const u=ME();const mode=(e.submitter&&e.submitter.value)||'submit';const d=readForm(f);const editId=UI.p.edit||null;
  const edit=editId?S.recs.find(x=>x.id===editId):null;
  if(editId&&(!edit||!canEditRec(u,edit))){toast('అనుమతి లేదు','bad');return}
  let errs=validateRec(d,{user:u});
  if(mode==='draft'){const k={};['name','cat'].forEach(x=>{if(errs[x])k[x]=errs[x]});errs=k}
  const dup=findDup(d,editId);
  if(Object.keys(errs).length||dup){
    UI.p.form={d,errs,dup};render();
    toast(Object.keys(errs).length?Object.keys(errs).length+' లోపాలు — సరిచేయండి':'డూప్లికేట్ రికార్డ్ — సేవ్ కాలేదు','bad');
    const el=$('.field.bad')||$('#dupbox');if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'center'})}catch(x){}
    return;
  }
  if(edit){
    const ch=applyEdit(edit,d,u);
    if(mode==='submit'&&isEntry(u)&&edit.wf==='draft'){edit.wf='submitted';hist(edit,u,'ఆమోదానికి సమర్పణ','')}
    if(isEntry(u)&&mode==='draft'&&edit.wf==='returned'){/* stays returned until submitted */}
    audit('రికార్డ్ సవరణ',edit.id,ch.join('; ')||'మార్పులు లేవు',recDiv(edit));
    toast('సేవ్ చేయబడింది','ok');go('rec','list',{id:edit.id});return;
  }
  const r=createRecord(d,u,{wf:mode==='draft'?'draft':undefined});
  S.recs.push(r);audit('కొత్త రికార్డ్',r.id,r.name+' · '+r.cat,recDiv(r));
  toast(r.wf==='approved'?'రికార్డ్ సేవ్ + ఆమోదం అయింది':r.wf==='draft'?'డ్రాఫ్ట్ సేవ్ అయింది':'ఆమోదానికి పంపబడింది','ok');
  go('rec','list',{id:r.id});
};

const EXPORT_COLS=[['id','ID'],['name','సంస్థ పేరు'],['cat','Category code'],['catname','Category'],['div','Division'],['stars','రేటింగ్'],['tm','సమయం'],['state','రాష్ట్రం'],['district','జిల్లా'],['contact','సంప్రదింపు వ్యక్తి'],['desig','హోదా'],['phone','ఫోన్'],['email','ఇమెయిల్'],['website','వెబ్‌సైట్'],['status','Pipeline స్థితి'],['owner','ఓనర్'],['lastContact','చివరి సంప్రదింపు'],['nextAction','తరువాతి చర్య'],['nextDue','చర్య గడువు'],['nexus','FEED nexus'],['tags','ఇక్కడ కూడా (ఆమోదించినవి)'],['wf','ఆమోద స్థితి'],['updatedAt','చివరి నవీకరణ'],['batch','బ్యాచ్']];
async function exportRecs(list,fname){
  if(!needExcel())return;const u=ME();
  if(isEntry(u))list=list.filter(r=>r.createdBy===u.id);
  list=list.filter(r=>canSeeRec(u,r));
  if(!list.length){toast('ఎక్స్‌పోర్ట్ చేయడానికి రికార్డులు లేవు','warn');return}
  const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Records');
  ws.addRow(EXPORT_COLS.map(c=>c[1]));styleHeader(ws.getRow(1));
  list.forEach(r=>{const c=cinfo(r.cat);const x={id:r.id,catname:c.te,div:c.div,stars:'★'.repeat(c.st),tm:'T'+c.tm,status:pipeLbl(r.status),owner:uName(r.owner),tags:effTags(r).map(t=>t.cat).join(', '),wf:WF[r.wf].te,updatedAt:fmtStamp(r.updatedAt)};ws.addRow(EXPORT_COLS.map(([k])=>x[k]!==undefined?x[k]:(r[k]==null?'':r[k])))});
  autoWidth(ws);ws.views=[{state:'frozen',ySplit:1}];
  audit('Excel ఎక్స్‌పోర్ట్','',list.length+' రికార్డులు');

/* ---------- parsing ---------- */
function cellText(c){
  let v=c.value;if(v==null)return'';
  if(v instanceof Date)return v.getUTCFullYear()+'-'+pad(v.getUTCMonth()+1)+'-'+pad(v.getUTCDate());
  if(typeof v==='object'){
    if(v.richText)return v.richText.map(x=>x.text).join('').trim();
    if(v.result!==undefined&&v.result!==null){return v.result instanceof Date?cellText({value:v.result}):String(v.result).trim()}
    if(v.text!==undefined)return String(v.text).trim();
    if(v.error)return'';
    return String(v).trim();
  }
  return String(v).trim();
}
function hdrNorm(s){return String(s||'').replace(/★/g,'').replace(/\s+/g,' ').trim()}
function toRecData(raw,u){
  const d={};
  RECFIELDS.forEach(f=>{d[f.k]=raw[f.k]==null?'':String(raw[f.k]).trim()});
  d.cat=d.cat.toUpperCase();d.tag1=d.tag1.toUpperCase();d.tag2=d.tag2.toUpperCase();
  const stOk=S.settings.states.find(x=>norm(x)===norm(d.state));if(stOk)d.state=stOk;
  const pp=S.settings.pipeline.find(p=>p.id===d.status||norm(p.te)===norm(d.status));if(pp)d.status=pp.id;
  const ou=S.users.find(x=>norm(x.username)===norm(d.ownerU));d.owner=ou?ou.id:(d.ownerU?'?'+d.ownerU:'');
  d.tags=[];
  if(d.tag1||d.ev1)d.tags.push({cat:d.tag1,evidence:d.ev1});
  if(d.tag2||d.ev2)d.tags.push({cat:d.tag2,evidence:d.ev2});
  return d;
}
async function parseBulk(file,u){
  const out={fname:file.name,fatal:'',rows:[],counts:{ok:0,err:0,dup:0},total:0};
  if(!file||!/\.xlsx$/i.test(file.name)){out.fatal='తప్పు ఫైల్ రకం: “'+(file?file.name:'')+'” — .xlsx (Excel) ఫైల్ మాత్రమే అప్‌లోడ్ చేయండి. (CSV, PDF, .xls పనిచేయవు.)';return out}
  if(file.size>10*1024*1024){out.fatal='ఫైల్ చాలా పెద్దది (గరిష్ఠం 10 MB).';return out}
  if(!file.size){out.fatal='ఫైల్ ఖాళీగా ఉంది (0 bytes).';return out}
  const wb=new ExcelJS.Workbook();
  try{await wb.xlsx.load(await file.arrayBuffer())}catch(e){out.fatal='ఫైల్ చదవలేకపోయాం — ఇది నిజమైన .xlsx కాకపోవచ్చు లేదా పాడైంది. టెంప్లేట్ లో నింపిన ఫైల్ వాడండి.';return out}
  const ws=wb.getWorksheet(BULK_SHEET);
  if(!ws){out.fatal='“Data” షీట్ కనిపించలేదు. FEED_Bulk_Template.xlsx లోనే డేటా నింపండి.';return out}
  const bad=[];RECFIELDS.forEach((f,i)=>{const h=hdrNorm(cellText(ws.getRow(1).getCell(i+1)));if(h!==f.te)bad.push((i+1)+'వ కాలమ్: “'+f.te+'” కావాలి, “'+h+'” ఉంది')});
  if(bad.length){out.fatal='Headings టెంప్లేట్ కి సరిపోలడం లేదు ('+bad.slice(0,3).join('; ')+(bad.length>3?'…':'')+'). 1వ వరుస లేదా కాలమ్ క్రమం మార్చవద్దు.';return out}
  const raws=[];
  ws.eachRow({includeEmpty:false},(row,n)=>{
    if(n===1)return;const raw={};let any=false;
    RECFIELDS.forEach((f,i)=>{const t=cellText(row.getCell(i+1));raw[f.k]=t;if(t)any=true});
    if(any)raws.push({n,raw});
  });
  if(!raws.length){out.fatal='ఫైల్ లో డేటా వరుసలు లేవు (“Data” షీట్ ఖాళీగా ఉంది).';return out}
  if(raws.length>S.settings.bulkLimit){out.fatal='వరుసలు '+raws.length+' — ఒక్కసారికి గరిష్ఠ పరిమితి '+S.settings.bulkLimit+'. ఫైల్ ను భాగాలుగా చేసి అప్‌లోడ్ చేయండి.';return out}
  const seenName=new Map(),seenPh=new Map();
  raws.forEach(({n,raw})=>{
    const d=toRecData(raw,u);const errs=validateRec(d,{user:u});
    if(errs.owner&&String(d.owner).charAt(0)==='?')errs.owner='ఈ username తో వినియోగదారు లేరు';
    if(errs.cat&&CATMAP[d.cat]&&CATMAP[d.cat].div&&DIVMAP[CATMAP[d.cat].div].board&&!isSuper(u))errs.cat='PL బోర్డ్-అంతర్గతం — Super Admin మాత్రమే వాడగలరు';
    const msgs=Object.keys(errs).map(k=>colLabel(k)+': '+errs[k]);
    let kind=msgs.length?'err':'ok',dupWhy='';
    const nk=norm(d.name)+'|'+norm(d.state),ph=digits(d.phone).slice(-10);
    const ex=findDup(d,null);
    if(ex)dupWhy='ఇప్పటికే ఉంది: '+ex.rec.id+' ('+ex.why+')';
    else if(nk.length>1&&d.name&&d.state&&seenName.has(nk))dupWhy='ఫైల్ లో వరుస '+seenName.get(nk)+' తో డూప్లికేట్ (పేరు+రాష్ట్రం)';
    else if(ph.length===10&&seenPh.has(ph))dupWhy='ఫైల్ లో వరుస '+seenPh.get(ph)+' తో డూప్లికేట్ (ఫోన్)';
    if(dupWhy){msgs.push('డూప్లికేట్: '+dupWhy);if(kind==='ok')kind='dup'}
    if(kind==='ok'){if(d.name&&d.state&&!seenName.has(nk))seenName.set(nk,n);if(ph.length===10&&!seenPh.has(ph))seenPh.set(ph,n)}
    out.rows.push({n,raw,d,kind,msgs});out.counts[kind]++;
  });
  out.total=raws.length;
  return out;
}

function moveTask(id,to){

'use strict';
SCR.ins=function(u){
  const tabs=[{id:'charts',te:'ఇన్ఫోగ్రాఫిక్స్'},{id:'tracker',te:'స్థితి ట్రాకర్'},{id:'nexus',te:'Nexus'},{id:'reports',te:'Excel నివేదికలు'}];

const apRecs=u=>scopedRecs(u).filter(r=>r.wf==='approved');
function svgWrap(h,vb,label){return '<svg viewBox="0 0 '+vb+'" role="img" aria-label="'+esc(label)+'" preserveAspectRatio="xMidYMid meet">'+h+'</svg>'}
function barsH(items,o={}){
  const W=560,lw=o.lw||150,rh=26,max=Math.max(1,...items.map(i=>i.v)),bw=W-lw-60;
  let s='';items.forEach((it,i)=>{const y=i*rh+4,w=Math.round(it.v*bw/max);
    s+='<text class="ax" x="'+(lw-8)+'" y="'+(y+15)+'" text-anchor="end" font-size="12">'+esc(it.l)+'</text><rect x="'+lw+'" y="'+y+'" width="'+Math.max(it.v?2:0,w)+'" height="18" rx="4" style="fill:'+it.c+'"></rect><text x="'+(lw+w+6)+'" y="'+(y+14)+'" font-size="12" font-weight="700">'+it.v+(it.t?' <tspan class="ax" font-weight="400">'+esc(it.t)+'</tspan>':'')+'</text>'});
  return svgWrap(s,W+' '+(items.length*rh+8),o.label||'chart');
}
function donut(items,center){
  const tot=sum(items.map(i=>i.v));const R=70,r=44,cx=90,cy=90;let a0=-Math.PI/2;let s='';
  if(!tot)s='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" style="stroke:var(--border)" stroke-width="'+(R-r)+'"/>';
  items.forEach(it=>{if(!it.v)return;const a1=a0+it.v/tot*Math.PI*2;const big=a1-a0>Math.PI?1:0;
    if(it.v===tot){s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" style="stroke:'+it.c+'" stroke-width="'+(R-r)+'"/>'}
    else s+='<path d="M'+(cx+R*Math.cos(a0))+' '+(cy+R*Math.sin(a0))+' A'+R+' '+R+' 0 '+big+' 1 '+(cx+R*Math.cos(a1))+' '+(cy+R*Math.sin(a1))+' L'+(cx+r*Math.cos(a1))+' '+(cy+r*Math.sin(a1))+' A'+r+' '+r+' 0 '+big+' 0 '+(cx+r*Math.cos(a0))+' '+(cy+r*Math.sin(a0))+' Z" style="fill:'+it.c+'"></path>';a0=a1});
  s+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" font-size="22" font-weight="700">'+(center==null?tot:center)+'</text>';
  let lg='';items.forEach((it,i)=>{lg+='<rect x="190" y="'+(22+i*26)+'" width="14" height="14" rx="3" style="fill:'+it.c+'"></rect><text x="212" y="'+(34+i*26)+'" font-size="12.5">'+esc(it.l)+' — <tspan font-weight="700">'+it.v+'</tspan></text>'});
  return svgWrap(s+lg,'440 180','donut');
}
function stackH(rows,keys,colors,labels){
  const W=560,lw=110,rh=28;const max=Math.max(1,...rows.map(r=>sum(keys.map(k=>r[k]||0))));const bw=W-lw-40;let s='';
  rows.forEach((r,i)=>{const y=i*rh+4;let x=lw;
    s+='<text class="ax" x="'+(lw-8)+'" y="'+(y+15)+'" text-anchor="end" font-size="12">'+esc(r.l)+'</text>';
    keys.forEach((k,j)=>{const v=r[k]||0;if(!v)return;const w=Math.max(4,Math.round(v*bw/max));s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="18" style="fill:'+colors[j]+'"><title>'+esc(labels[j])+': '+v+'</title></rect>';if(w>16)s+='<text x="'+(x+w/2)+'" y="'+(y+13)+'" text-anchor="middle" font-size="11" style="fill:#fff" font-weight="700">'+v+'</text>';x+=w});
  });
  const lgy=rows.length*rh+14;let lg='';keys.forEach((k,j)=>{lg+='<rect x="'+(lw+j*110)+'" y="'+lgy+'" width="12" height="12" rx="3" style="fill:'+colors[j]+'"></rect><text x="'+(lw+j*110+17)+'" y="'+(lgy+11)+'" font-size="11.5">'+esc(labels[j])+'</text>'});
  return svgWrap(s+lg,W+' '+(lgy+22),'stack');
}
function chartCard(title,svg,insight,sub){return '<div class="card chart"><h3>'+esc(title)+'</h3>'+(sub?'<div class="xs muted" style="margin-bottom:6px">'+esc(sub)+'</div>':'')+svg+'<div class="insight">💡 '+insight+'</div></div>'}
function chartsView(u){
  const ds=visibleDivs(u),cats=visibleCats(u),rs=apRecs(u);
  const per=ds.map(d=>({l:d.code+' · '+d.te,code:d.code,v:rs.filter(r=>recDiv(r)===d.code).length,c:'var(--c-'+d.code+')'}));
  const sorted=per.slice().sort((a,b)=>b.v-a.v);
  const covered=new Set(rs.map(r=>r.cat));
  let h=pageHead('ఇన్ఫోగ్రాఫిక్స్','ఆమోదించిన రికార్డుల ఆధారంగా · '+ds.length+' divisions · '+cats.length+' categories');
  if(!rs.length)return h+emptyBox('ఆమోదించిన రికార్డులు లేవు — ఇన్ఫోగ్రాఫిక్స్ రికార్డులు వచ్చాక కనిపిస్తాయి.');
  /* 1 */
  const top=sorted[0],low=sorted[sorted.length-1],zero=per.filter(x=>x.v===0);
  const c1=chartCard('1 · Division వారీగా రికార్డులు',barsH(per,{lw:170,label:'Division వారీగా రికార్డులు'}),'అత్యధికం <b>'+esc(top.l)+'</b> ('+top.v+'), అత్యల్పం <b>'+esc(low.l)+'</b> ('+low.v+')'+(zero.length?'. <b>'+zero.length+'</b> divisions లో ఇంకా ఆమోదిత రికార్డులు లేవు.':'.'));
  /* 2 */
  const starRows=[5,4,3,2].map(n=>{const cs=cats.filter(c=>c.st===n);const cv=cs.filter(c=>covered.has(c.code)).length;return{n,tot:cs.length,cv,pc:pct(cv,cs.length)}});
  const s5=starRows[0];
  const c2=chartCard('2 · రేటింగ్ వారీగా కవరేజ్ (రికార్డులున్న categories %)',barsH(starRows.map(x=>({l:'★'.repeat(x.n)+' ('+x.cv+'/'+x.tot+')',v:x.pc,t:'%',c:'var(--gold)'})),{lw:150,label:'రేటింగ్ కవరేజ్'}),'★★★★★ categories లో కవరేజ్ <b>'+s5.pc+'%</b> — <b>'+(s5.tot-s5.cv)+'</b> అత్యంత కీలక categories లో ఇంకా ఆమోదిత రికార్డ్ లేదు.');
  /* 3 */

  /* category nexus list */
  const q=norm(UI.nx.q);let cs=visibleCats(u);if(UI.nx.div)cs=cs.filter(c=>c.div===UI.nx.div);if(q)cs=cs.filter(c=>norm(c.te+' '+c.en+' '+c.nexus+' '+c.code).includes(q));

UI.af={q:'',action:'',user:'',from:'',to:''};
const AUD_PER=25;
function filterAudit(u){
  const f=UI.af;let a=visibleAudit(u).slice().reverse();
  if(f.q){const q=norm(f.q);a=a.filter(x=>norm(x.action+' '+x.target+' '+x.detail+' '+x.un).includes(q))}

};

};

   sec:['9 · భద్రత',
    '<ul class="sm"><li><b>Authentication:</b> పాస్‌వర్డ్ లు argon2/bcrypt hash; session cookie (HttpOnly, Secure, SameSite) లేదా short-lived JWT + refresh; లాగిన్ rate-limit; MFA (Super కి సిఫార్సు).</li><li><b>Authorization:</b> ప్రతి API లో server-side RBAC + division scope — query స్థాయిలోనే ఫిల్టర్. UI లో దాచడం భద్రత కాదు. PL డేటా ఇతర పాత్రలకు ఎప్పుడూ తిరిగి పంపరాదు (counts తో సహా).</li><li><b>Audit:</b> append-only పట్టిక; అప్లికేషన్ ఖాతాకు UPDATE/DELETE అనుమతి ఇవ్వరాదు.</li><li><b>Input:</b> అన్ని ఇన్‌పుట్ లు server లో validate; output escaping; Excel అప్‌లోడ్ కి పరిమాణం/రకం/zip పరిమితులు.</li><li><b>డేటా రక్షణ:</b> సంప్రదింపు వ్యక్తుల ఫోన్/ఇమెయిల్ వ్యక్తిగత సమాచారం — ఉద్దేశం, సమ్మతి, నిల్వ కాలం, యాక్సెస్ లాగ్ విధానం చట్ట నిపుణులతో నిర్ధారించుకోండి (నేను న్యాయ సలహా ఇవ్వలేను).</li><li><b>Infra:</b> TLS, రోజువారీ బ్యాకప్ + restore పరీక్ష, secrets vault, CSP headers.</li></ul>'],

   open:['12 · బోర్డ్ నిర్ణయాలు & ఊహలు',
    '<h4>బోర్డ్ నిర్ణయాలు (నేను నిర్ణయించలేదు)</h4><ul class="sm"><li><b>D1:</b> PRI / గ్రామ పంచాయతీ ని taxonomy లో చేర్చాలా?</li><li><b>D2:</b> “Star Export House” ని tag గా ఉంచాలా, category గా చేయాలా?</li></ul><p class="sm">ఈ రెండూ “Taxonomy మాస్టర్” లో నమోదు చేయవచ్చు; నిర్మాణంపై ప్రభావం లేదు.</p>'+
    '<h4>నేను తీసుకున్న ఊహలు (మార్చవచ్చు)</h4><ul class="sm"><li>Tag ఆమోదం: ప్రాంప్ట్ లో అస్పష్టత ఉండేది — ఇక్కడ ఆ category division Admin కూడా ఆమోదించగలరు (Super తో పాటు).</li><li>బల్క్ లో సరైన వరుసలు మాత్రమే దిగుమతి; లోపాలున్నవి ఆపబడతాయి (అన్నీ-లేదా-ఏదీ కాదు).</li><li>Data Entry డ్రాఫ్ట్: పేరు + category మాత్రమే తప్పనిసరి; “ఆమోదానికి పంపు” కి పూర్తి validation.</li><li>Excel లో nexus ఖాళీగా ఉంటే లోపం (ఫారంలో category ఎంచుకోగానే డిఫాల్ట్ నిండుతుంది).</li><li>తాజాదనం = రికార్డుల చివరి నవీకరణ (సేవ్/ఆమోదం) తేదీ; డ్రాఫ్ట్ లు లెక్కలోకి రావు.</li><li>ఇన్ఫోగ్రాఫిక్స్ లో ఆమోదించిన రికార్డులు మాత్రమే.</li></ul>'+
    '<h4>ఇంకా చేయనివి (నిజ అప్లికేషన్ లో)</h4><ul class="sm"><li>Server, DB, నిజమైన authentication, ఇమెయిల్/WhatsApp నోటిఫికేషన్లు.</li><li>ఆధార పత్రాల ఫైల్ అప్‌లోడ్.</li><li>ఆఫ్‌లైన్ / మొబైల్ app.</li></ul>']

function fmtVal(d,f,r){
  const v=r[f.k];if(v===''||v==null)return '<span class="muted">—</span>';
  switch(f.t){
    case 'sel':return esc(lblOf(f,v));
    case 'date':return esc(fmtDate(v));
    case 'num':return /(₹)/.test(f.te)?esc(money(v)):esc(String(v));
    case 'user':return esc(uName(v));
    case 'dist':return esc(distName(v));
    case 'obj':return esc(v)+(OBJMAP[v]?' · '+esc(OBJMAP[v].n):'');
    case 'stk':{const m=S.recs.find(x=>x.id===v);return m?'<button class="linkbtn" data-act="rec-goto" data-id="'+esc(v)+'" >'+esc(v)+' · '+esc(m.name)+'</button>':esc(v)}
    case 'url':return esc(v);
    default:return esc(String(v)).replace(/\n/g,'<br>');
  }
}

  if(!f)return esc(r[k]);
  if(f.t==='sel'&&(k===d.statusK||k==='phrt'||k==='done'||k==='verified'||k==='stage')){const c={won:'ok',paid:'ok',approved:'ok',held:'ok',act:'ok',pass:'ok',yes:'ok',lost:'bad',fail:'bad',block:'bad',rejected:'bad',cancel:'bad',expired:'bad',no:k==='done'?'warn':''}[r[k]]||'info';return '<span class="chip '+c+'">'+esc(lblOf(f,r[k]))+'</span>'}

function regFilter(u,d){
  const f=rq(d.key);let a=regVisible(u,d);
  if(f.st&&d.statusK)a=a.filter(r=>r[d.statusK]===f.st);
  if(f.ty)a=a.filter(r=>r.type===f.ty);
  if(f.od)a=a.filter(r=>regOverdue(d,r));

  return a;
}

function validateReg(d,r,old,u){
  const E={};const all=[];
  d.fields.forEach(f=>{
    const v=r[f.k];const empty=v===''||v==null;
    if(f.req&&empty){E[f.k]='తప్పనిసరి';return}
    if(empty)return;
    if(f.t==='num'){if(!isFinite(v))E[f.k]='సంఖ్య ఇవ్వండి';else{if(f.min!=null&&v<f.min)E[f.k]='కనీసం '+f.min;if(f.max!=null&&v>f.max)E[f.k]='గరిష్ఠం '+f.max}}
    else if(f.t==='date'){if(!isDate(v))E[f.k]='సరైన తేదీ ఇవ్వండి'}
    else if(f.t==='sel'){if(!optsOf(f).some(o=>String(o[0])===String(v)))E[f.k]='జాబితాలోని విలువ ఎంచుకోండి'}
    else if(f.t==='user'){if(!userById(v))E[f.k]='వినియోగదారు లేరు'}
    else if(f.t==='dist'){if(!(S.reg.districts||[]).some(x=>x.id===v))E[f.k]='జిల్లా జాబితాలో లేదు'}
    else if(f.t==='obj'){if(!OBJMAP[v])E[f.k]='Objective తెలియదు'}
    else if(f.t==='stk'){const m=S.recs.find(x=>x.id===v);if(!m||!canSeeRec(u,m))E[f.k]='ఈ ID తో రికార్డ్ లేదు లేదా మీకు కనిపించదు'}
    if(f.rx&&!E[f.k]&&!new RegExp(f.rx).test(String(v)))E[f.k]='ఫార్మాట్ సరిగా లేదు';
    if((f.t==='text'||f.t==='area')&&String(v).length>(f.t==='area'?2000:300))E[f.k]='చాలా పొడవు';
  });
  if(d.validate&&!Object.keys(E).length)d.validate(r,old).forEach(m=>all.push(m));
  if(d.dup&&!Object.keys(E).length&&!all.length){const x=d.dup(r,old);if(x)all.push('ఇప్పటికే ఉంది: '+x.id+' — డూప్లికేట్ నమోదు కాదు')}
  if(all.length)E.__all=all;
  return E;
}

      if(f.t==='num'){const x=Number(t.replace(/,/g,''));if(!isFinite(x))errs.push(f.te+': సంఖ్య కాదు');else r[f.k]=x;return}
      if(f.t==='stk'){const m=t.match(/^(REC-\d+)/);r[f.k]=m?m[1]:t;return}
      r[f.k]=t});
    if(!errs.length){const E=validateReg(d,r,null,u);Object.keys(E).forEach(k=>{if(k==='__all')E.__all.forEach(m=>errs.push(m));else{const f=d.fields.find(x=>x.k===k);errs.push((f?f.te:k)+': '+E[k])}})}

  });

}

function tradeSummary(u){
  const t=regVisible(u,REGDEFS.tenders),o=regVisible(u,REGDEFS.orders);const open=t.filter(x=>TND_OPEN.includes(x.status));

function cardSummary(u){
  const c=regVisible(u,REGDEFS.cards);const lv=REGDEFS.cards.fields[3].opts;
  let h='<div class="grid g4 kp">'+kpi(c.length,'మొత్తం Cards')+kpi(cnt(c,x=>x.level!=='basic'),'Gold లేదా పైవి','ok')+kpi(c.reduce((a,x)=>a+(Number(x.coinsEarned)||0),0).toLocaleString('en-IN'),'సంపాదించిన Krishi Coins')+kpi(c.reduce((a,x)=>a+(Number(x.coinsRedeemed)||0),0).toLocaleString('en-IN'),'వాడిన Coins')+'</div>';
  h+='<div class="grid g4 kp">'+kpi(cnt(c,x=>Number(x.ccs)>=800),'FEED-AAA (Credit Score 800+)','ok')+kpi(cnt(c,x=>x.level==='platinum'),'Platinum (KYJ-1)')+kpi(cnt(c,x=>Number(x.kyjStage)>=7),'KYJ దశ 7 చేరినవి')+kpi(cnt(c,x=>Number(x.ccs)>0),'Credit Score ఉన్నవి')+'</div>';
  h+='<div class="card"><h3>స్థాయి వారీగా</h3>'+tbl(['స్థాయి','Cards','క్రియాశీలం'],lv.map(l=>[esc(l[1]),cnt(c,x=>x.level===l[0]),cnt(c,x=>x.level===l[0]&&x.status==='active')]))+'<div class="xs muted">Coins విలువ ₹0.10, నగదు కాదు, 12 నెలల తర్వాత గడువు — గడువు దాటిన coins ను లెక్కించే ఆటోమేషన్ ఈ డెమోలో లేదు.</div></div>';
  return h;
}
function retailSummary(u){
  const o=regVisible(u,REGDEFS.outlets);const f=REGDEFS.outlets.fields[1].opts;
  let h='<div class="grid g4 kp">'+kpi(o.length,'మొత్తం ఔట్‌లెట్లు')+kpi(cnt(o,x=>x.status==='operating'),'నడుస్తున్నవి','ok')+kpi(cnt(o,x=>x.model==='semi'),'Semi-ownership')+kpi(money(o.filter(x=>x.status==='operating').reduce((a,x)=>a+(Number(x.monthlySales)||0),0)),'నెలవారీ అమ్మకాలు (నడుస్తున్నవి)')+'</div>';
  h+='<div class="card"><h3>ఫార్మాట్ వారీగా</h3>'+tbl(['ఫార్మాట్','మొత్తం','నడుస్తున్నవి'],f.map(x=>[esc(x[1]),cnt(o,y=>y.format===x[0]),cnt(o,y=>y.format===x[0]&&y.status==='operating')]))+'<div class="xs muted">Retail holding company ఇంకా ఏర్పడలేదు; ఇది ట్రాకింగ్ మాత్రమే.</div></div>';
  return h;
}
function bmcSummary(u){
  const b=regVisible(u,REGDEFS.bmc);const st=REGDEFS.bmc.fields.find(f=>f.k==='status').opts;
  let h='<div class="grid g4 kp">'+kpi(b.length,'మొత్తం బుకింగ్‌లు')+kpi(cnt(b,x=>['agreed','growing','harvested','packed'].includes(x.status)),'ప్రగతిలో')+kpi(cnt(b,x=>x.status==='delivered'),'డెలివరీ అయినవి','ok')+kpi(cnt(b,x=>regOverdue(REGDEFS.bmc,x)),'డెలివరీ గడువు దాటినవి',cnt(b,x=>regOverdue(REGDEFS.bmc,x))?'bad':'')+'</div>';

}

const cardOf=id=>(S.reg.cards||[]).find(c=>c.id===id);
const DSMS_FIRST=['ridf','pmfme','midh'];   // V4 Master: "post DSMS formation"
const SCH_REF={aif:'₹200 L',ridf:'₹150 L',sfac:'₹25 L',smam:'₹40 L',pmfme:'₹35 L',midh:'₹50 L',kusum:'₹30 L',deds:'₹25 L',pmmsy:'₹15 L',pmksy:'₹14 L',vbg:'₹20 L (అంచనా, TBC)',bgap:'₹5 L',ccts:'₹7.6 L / సంవత్సరం'};

/* ---------- Agri Fintech: loan facilitation (FEED never lends) ---------- */
defReg('loans',{te:'రుణ అనుసంధానాలు',one:'రుణ అభ్యర్థన',mod:'fint',pre:'LON-',kind:'lon',statusK:'status',
 title:r=>r.member+' · '+lblOf(REGDEFS.loans.fields.find(f=>f.k==='product'),r.product),cols:['member','product','partner','amount','status','sanctAmt','disbAmt'],
 fields:[
  {k:'member',te:'రైతు / సభ్యుడు / సంస్థ',t:'text',req:1},
  {k:'stk',te:'స్టేక్‌హోల్డర్ రికార్డ్ (ఐచ్ఛికం)',t:'stk'},
  {k:'card',te:'FEED Card',t:'sel',opts:cardOpt,hint:'రెఫరల్ కు Card లో FIRC రిఫరెన్స్ + Credit Score ఉండాలి'},
  {k:'dist',te:'జిల్లా',t:'dist'},
  {k:'product',te:'రుణ ఉత్పత్తి',t:'sel',opts:[['kcc','KCC పెంపు'],['fpowc','FPO వర్కింగ్ క్యాపిటల్'],['enwr','గిడ్డంగి రసీదు రుణం (eNWR)'],['msme','గ్రామీణ MSME / MUDRA'],['pre','ముందే ఆమోదించిన ఆఫర్ (FEED-AAA)'],['other','ఇతర']],req:1},
  {k:'partner',te:'రుణ భాగస్వామి',t:'sel',opts:[['samunnati','Samunnati (ఖరారైన భాగస్వామి)'],['jaikisan','Jai Kisan (ఖరారైన భాగస్వామి)'],['other','ఇతర (empanelment లేదు)']],req:1,hint:'FEED స్వయంగా అప్పు ఇవ్వదు; empanelled భాగస్వాముల ద్వారా మాత్రమే'},
  {k:'amount',te:'కోరిన మొత్తం (₹)',t:'num',min:1,req:1},
  {k:'ltv',te:'LTV % (eNWR కి 70–80)',t:'num',min:0,max:100},
  {k:'status',te:'స్థితి',t:'sel',opts:[['enq','విచారణ'],['ccs','Credit Score తనిఖీ'],['ref','భాగస్వామికి పంపాం'],['sanct','మంజూరైంది'],['disb','విడుదలైంది'],['rej','తిరస్కరణ'],['closed','మూసివేశాం']],req:1},
  {k:'refDate',te:'భాగస్వామికి పంపిన తేదీ',t:'date'},
  {k:'sanctAmt',te:'మంజూరైన మొత్తం (₹)',t:'num',min:0},
  {k:'sanctDate',te:'మంజూరు తేదీ',t:'date'},
  {k:'disbAmt',te:'విడుదలైన మొత్తం (₹)',t:'num',min:0},
  {k:'feePct',te:'FEED consultation fee % (సుమారు 2.5 సగటు)',t:'num',min:0,max:10},
  {k:'notes',te:'గమనికలు',t:'area'}],
 validate:r=>{const e=[];const adv=['ref','sanct','disb'].includes(r.status);const c=cardOf(r.card);
  if(adv){
   if(!c)e.push('భాగస్వామికి పంపే ముందు FEED Card ఎంచుకోండి');
   else{if(!String(c.fircRef||'').trim()||!(Number(c.ccs)>0))e.push('ఆ Card లో FIRC రిఫరెన్స్ మరియు Credit Score లేవు — మొదటి FIRC తర్వాతే క్రెడిట్ ఉత్పత్తులు (FIREWALL 3)')}
   if(r.partner==='other')e.push('Empanelled భాగస్వామి (Samunnati / Jai Kisan) కాకుండా రెఫరల్ చేయలేరు');
   if(!r.refDate)e.push('పంపిన తేదీ తప్పనిసరి')}
  if(r.product==='pre'&&adv&&(!c||!(Number(c.ccs)>=800)))e.push('ముందే ఆమోదించిన ఆఫర్ కి Credit Score 800+ (FEED-AAA) అవసరం');
  if(r.product==='enwr'&&!(Number(r.ltv)>=70&&Number(r.ltv)<=80))e.push('eNWR రుణానికి LTV 70–80% మధ్య ఉండాలి');
  if(['sanct','disb'].includes(r.status)){
   if(!(Number(r.sanctAmt)>0)||!r.sanctDate)e.push('మంజూరు మొత్తం మరియు తేదీ తప్పనిసరి');
   if(Number(r.sanctAmt)>Number(r.amount))e.push('మంజూరైన మొత్తం కోరిన మొత్తం కంటే ఎక్కువ ఉండకూడదు')}
  if(r.status==='disb'&&!(Number(r.disbAmt)>0))e.push('విడుదలైన మొత్తం తప్పనిసరి');
  if(r.disbAmt!==''&&Number(r.disbAmt)>0&&Number(r.disbAmt)>Number(r.sanctAmt||0))e.push('విడుదల మొత్తం మంజూరు కంటే ఎక్కువ ఉండకూడదు');
  if(r.refDate&&r.sanctDate&&r.sanctDate<r.refDate)e.push('మంజూరు తేదీ పంపిన తేదీ కంటే ముందు ఉండకూడదు');
  return e},
 dup:(r,old)=>(S.reg.loans||[]).find(x=>x.id!==(old&&old.id)&&!['rej','closed'].includes(x.status)&&norm(x.member)===norm(r.member)&&x.product===r.product&&Number(x.amount)===Number(r.amount)),
 defaults:()=>({status:'enq',product:'kcc',partner:'samunnati'})});

defReg('schemeapps',{te:'పథకాల దరఖాస్తులు',one:'దరఖాస్తు',mod:'govt',pre:'SCA-',kind:'sca',statusK:'status',dueK:'nextDue',dueOpen:['ident','call','dpr','filed','rev'],perm:{create:['super','admin'],entryEdit:false},
 title:r=>lblOf(REGDEFS.schemeapps.fields[0],r.scheme)+' · '+distName(r.dist),cols:['scheme','dist','entity','status','amtApplied','amtSanct','nextDue'],
 fields:[
  {k:'scheme',te:'పథకం',t:'sel',opts:()=>SCHEMES.map(x=>[x[0],x[1]]),req:1},
  {k:'dist',te:'జిల్లా',t:'dist',req:1},
  {k:'entity',te:'దరఖాస్తుదారు (DSMS / FPO)',t:'text'},
  {k:'agency',te:'ఏజెన్సీ / సంప్రదింపు వ్యక్తి',t:'text'},
  {k:'status',te:'స్థితి',t:'sel',opts:[['ident','గుర్తించాం'],['call','ముందస్తు కాల్ చేశాం'],['dpr','DPR సిద్ధం'],['filed','దాఖలు చేశాం'],['rev','పరిశీలనలో'],['sanct','మంజూరైంది'],['rel','విడుదలైంది'],['rej','తిరస్కరణ']],req:1},
  {k:'pmuCall',te:'AIF PMU కి ముందస్తు కాల్ చేశామా',t:'sel',opts:YN,hint:'AIF కి మాత్రమే వర్తిస్తుంది: DPR ముందు కాల్ తప్పనిసరి'},
  {k:'filedDate',te:'దాఖలు తేదీ',t:'date'},
  {k:'refNo',te:'దరఖాస్తు / రిఫరెన్స్ నంబర్',t:'text'},
  {k:'amtApplied',te:'కోరిన మొత్తం (₹)',t:'num',min:0},
  {k:'amtSanct',te:'మంజూరైన మొత్తం (₹)',t:'num',min:0},
  {k:'amtRel',te:'విడుదలైన మొత్తం (₹)',t:'num',min:0},
  {k:'nextAction',te:'తదుపరి చర్య',t:'text'},
  {k:'nextDue',te:'తదుపరి చర్య గడువు',t:'date'},
  {k:'owner',te:'బాధ్యుడు',t:'user'},
  {k:'notes',te:'గమనికలు',t:'area'}],
 validate:r=>{const e=[];const past=['dpr','filed','rev','sanct','rel'];
  if(r.scheme==='aif'&&past.includes(r.status)&&r.pmuCall!=='yes')e.push('AIF: DPR / దాఖలు కు ముందు AIF PMU కి కాల్ చేసి “అవును” గా నమోదు చేయాలి');
  if(['filed','rev','sanct','rel'].includes(r.status)&&(!r.filedDate||!String(r.refNo||'').trim()))e.push('దాఖలు తర్వాత స్థితులకు దాఖలు తేదీ మరియు రిఫరెన్స్ నంబర్ తప్పనిసరి');
  if(['sanct','rel'].includes(r.status)){if(!(Number(r.amtSanct)>0))e.push('మంజూరైన మొత్తం తప్పనిసరి');
   if(Number(r.amtApplied)>0&&Number(r.amtSanct)>Number(r.amtApplied))e.push('మంజూరైన మొత్తం కోరిన మొత్తం కంటే ఎక్కువ ఉండకూడదు')}
  if(r.status==='rel'&&!(Number(r.amtRel)>0))e.push('విడుదలైన మొత్తం తప్పనిసరి');
  if(Number(r.amtRel)>0&&Number(r.amtRel)>Number(r.amtSanct||0))e.push('విడుదల మొత్తం మంజూరు కంటే ఎక్కువ ఉండకూడదు');
  if(DSMS_FIRST.includes(r.scheme)&&['filed','rev','sanct','rel'].includes(r.status)){
   const ok=(S.reg.safe||[]).some(x=>x.dist===r.dist&&['reg','ops'].includes(x.status));
   if(!ok)e.push('ఈ పథకం DSMS ఏర్పాటు తర్వాతే (V4 Master) — ఆ జిల్లాలో DSMS “నమోదైంది” కాలేదు')}
  if(r.filedDate&&r.filedDate>TODAY())e.push('దాఖలు తేదీ భవిష్యత్తులో ఉండకూడదు');
  return e},
 dup:(r,old)=>(S.reg.schemeapps||[]).find(x=>x.id!==(old&&old.id)&&x.scheme===r.scheme&&x.dist===r.dist&&norm(x.entity)===norm(r.entity)&&!['rej'].includes(x.status)),
 defaults:()=>({status:'ident',pmuCall:'no'})});

defReg('mous',{te:'MoU లు (జీవిత చక్రం)',one:'MoU',mod:'govt',pre:'MOU-',kind:'mou',statusK:'stage',dueK:'expiry',dueOpen:['signed','active'],perm:{create:['super','admin'],entryEdit:false},
 title:r=>r.party,cols:['party','level','state','stage','s61','signDate','expiry'],
 fields:[
  {k:'party',te:'భాగస్వామి (శాఖ / సంస్థ)',t:'text',req:1},
  {k:'level',te:'స్థాయి',t:'sel',opts:[['central','కేంద్రం'],['state','రాష్ట్రం'],['agency','ఏజెన్సీ / బోర్డు'],['inst','విద్యా / ఇతర సంస్థ'],['intl','అంతర్జాతీయ']],req:1},
  {k:'state',te:'రాష్ట్రం',t:'text'},
  {k:'stage',te:'దశ',t:'sel',opts:[['ident','గుర్తించాం'],['appr','సంప్రదించాం'],['draft','ముసాయిదా'],['neg','చర్చలు'],['signed','సంతకమైంది'],['active','అమలులో']],req:1,hint:'6 దశల పేర్లు నేను పెట్టిన సూచన; పత్రాల్లో 6 దశలు అని మాత్రమే ఉంది'},
  {k:'s61',te:'Section 61 అర్హత ఉన్న MoU',t:'sel',opts:YN,req:1,hint:'AP / TG Horticulture MoU లు అర్హమైనవి కావు (V4 Master)'},
  {k:'finSign',te:'ఆర్థిక శాఖ countersignature',t:'sel',opts:YN},
  {k:'equityCr',te:'S.61 equity ఉద్దేశ్యం (₹ కోట్లు)',t:'num',min:0},
  {k:'signDate',te:'సంతకం తేదీ',t:'date'},
  {k:'expiry',te:'గడువు ముగింపు',t:'date'},
  {k:'docRef',te:'పత్రం (పత్రాలు లోని ID)',t:'text'},
  {k:'owner',te:'బాధ్యుడు',t:'user'},
  {k:'notes',te:'గమనికలు',t:'area'}],
 validate:r=>{const e=[];
  if(['signed','active'].includes(r.stage)&&!r.signDate)e.push('సంతకమైన / అమలులో ఉన్న MoU కి సంతకం తేదీ తప్పనిసరి');
  if(r.s61==='yes'&&(r.finSign!=='yes'||!(Number(r.equityCr)>0)))e.push('S.61 అర్హత MoU కి ఆర్థిక శాఖ countersignature మరియు equity ఉద్దేశ్యం (₹ కోట్లు) తప్పనిసరి');
  if(r.signDate&&r.expiry&&r.expiry<r.signDate)e.push('గడువు ముగింపు సంతకం తేదీ కంటే ముందు ఉండకూడదు');
  if(r.signDate&&r.signDate>TODAY()&&['signed','active'].includes(r.stage))e.push('సంతకం తేదీ భవిష్యత్తులో ఉండకూడదు');
  if(r.docRef&&!(S.reg.docs||[]).some(d=>d.id===r.docRef))e.push('ఆ పత్రం ID “పత్రాలు” లో లేదు');
  return e},
 dup:(r,old)=>(S.reg.mous||[]).find(x=>x.id!==(old&&old.id)&&norm(x.party)===norm(r.party)&&norm(x.state)===norm(r.state)),
 defaults:()=>({stage:'ident',s61:'no',finSign:'no'})});

/* ---------- summaries ---------- */
function fintSummary(u){
  const l=regVisible(u,REGDEFS.loans);const st=REGDEFS.loans.fields.find(f=>f.k==='status').opts;
  const dis=l.filter(x=>x.status==='disb').reduce((a,x)=>a+(Number(x.disbAmt)||0),0);
  let h='<div class="grid g4 kp">'+kpi(l.length,'మొత్తం అభ్యర్థనలు')+kpi(cnt(l,x=>x.status==='ref'),'భాగస్వామి వద్ద పరిశీలనలో')+kpi(cnt(l,x=>x.status==='sanct'),'మంజూరైనవి')+kpi(money(dis),'విడుదలైన మొత్తం','ok')+'</div>';
  h+='<div class="card"><h3>స్థితి పైప్‌లైన్</h3>'+tbl(['స్థితి','సంఖ్య'],st.map(s=>[esc(s[1]),cnt(l,x=>x.status===s[0])]))+'<div class="xs muted">FEED స్వయంగా అప్పు ఇవ్వదు — empanelled భాగస్వాముల ద్వారా మాత్రమే. FEED ఓన్ NBFC (V9) ఆఫ్‌లో ఉంది. FEED fee “నమోదు” మాత్రమే; ఆదాయ లెక్క “FEED ఆర్థికం” లో.</div></div>';
  return h;
}
function govtSummary(u){
  const a=regVisible(u,REGDEFS.schemeapps),m=regVisible(u,REGDEFS.mous);
  const q=m.filter(x=>x.s61==='yes'&&['signed','active'].includes(x.stage)).length;
  let h='<div class="grid g4 kp">'+kpi(a.length,'పథకాల దరఖాస్తులు')+kpi(cnt(a,x=>['filed','rev'].includes(x.status)),'పరిశీలనలో')+kpi(money(a.filter(x=>['sanct','rel'].includes(x.status)).reduce((s,x)=>s+(Number(x.amtSanct)||0),0)),'మంజూరైన మొత్తం','ok')+kpi(q+' / 3','S.61 అర్హత MoU లు (షరతు 5)',q>=3?'ok':'bad')+'</div>';
  h+='<div class="card"><h3>పథకాల convergence</h3>'+tbl(['పథకం','ప్రతి DSMS కు అంచనా (V4 Master)','దరఖాస్తులు','మంజూరైనవి'],SCHEMES.map(s=>[esc(s[1]),esc(SCH_REF[s[0]]||'—'),cnt(a,x=>x.scheme===s[0]),cnt(a,x=>x.scheme===s[0]&&['sanct','rel'].includes(x.status))]))+'<div class="xs muted">అంచనా అంకెలు V4 Master నుంచి. పథకాల స్థితి జిల్లా మ్యాట్రిక్స్ (జిల్లాలు మాడ్యూల్) లో వేరుగా ఉంటుంది — ఇక్కడ మార్పులు అక్కడ ఆటోమేటిక్ గా మారవు. మొత్తం కూడిక చూపడం లేదు: V4 Master లో “₹714 L” అని ఉంది, కానీ అందులోని అంకెల మొత్తం ₹609 L.</div></div>';
  return h;

/* hash chain via WebCrypto (SHA-256); append-only */
const hex=buf=>Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
async function sha(str){try{return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)))}catch(e){return 'nohash'}}
async function cxLog(r,u,a,d){const cx=cxOf(r);const prev=cx.log.length?cx.log[cx.log.length-1].h:'0'.repeat(64);const e={t:nowStamp(),u:u?u.id:null,un:u?u.name:'',a,d:d||'',p:prev};e.h=await sha(prev+'|'+e.t+'|'+e.u+'|'+a+'|'+e.d);cx.log.push(e);save()}
async function cxVerify(r){const cx=cxOf(r);let prev='0'.repeat(64);for(let i=0;i<cx.log.length;i++){const e=cx.log[i];const h=await sha(prev+'|'+e.t+'|'+e.u+'|'+e.a+'|'+e.d);if(e.p!==prev||e.h!==h)return i+1;prev=e.h}return 0}

/* ---------- SVG shapes (shape + colour = colour-blind safe) ---------- */
const poly=(n,r,rot)=>Array.from({length:n},(_,i)=>{const a=rot+i*2*Math.PI/n;return [Math.cos(a)*r,Math.sin(a)*r]});
function shape(sh,x,y,r,c,title,attrs){
  const col=c==='#000000'?'var(--text)':c;const st='stroke="var(--surface)" stroke-width="'+(r*.2).toFixed(3)+'"';const a=(attrs||'');const T=title?'<title>'+esc(title)+'</title>':'';
  const P=pts=>'<polygon points="'+pts.map(p=>(x+p[0]).toFixed(2)+','+(y+p[1]).toFixed(2)).join(' ')+'" fill="'+col+'" '+st+' '+a+'>'+T+'</polygon>';
  switch(sh){
   case 'circle':return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+col+'" '+st+' '+a+'>'+T+'</circle>';
   case 'ring':return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="none" stroke="var(--text)" stroke-width="'+(r*.32).toFixed(3)+'" '+a+'>'+T+'</circle>';
   case 'square':return '<rect x="'+(x-r)+'" y="'+(y-r)+'" width="'+2*r+'" height="'+2*r+'" fill="'+col+'" '+st+' '+a+'>'+T+'</rect>';
   case 'tri':return P(poly(3,r*1.2,-Math.PI/2));case 'dtri':return P(poly(3,r*1.2,Math.PI/2));case 'diamond':return P(poly(4,r*1.25,-Math.PI/2));
   case 'hex':return P(poly(6,r*1.1,0));case 'pent':return P(poly(5,r*1.1,-Math.PI/2));
   case 'star':{const p=[];for(let i=0;i<10;i++){const rr=i%2?r*.5:r*1.3,an=-Math.PI/2+i*Math.PI/5;p.push([Math.cos(an)*rr,Math.sin(an)*rr])}return P(p)}
   case 'plus':{const k=r*.42,R=r*1.2;return P([[-k,-R],[k,-R],[k,-k],[R,-k],[R,k],[k,k],[k,R],[-k,R],[-k,k],[-R,k],[-R,-k],[-k,-k]])}
   case 'cross':{const k=r*.42,R=r*1.2,q=.7071;return P([[-k,-R],[k,-R],[k,-k],[R,-k],[R,k],[k,k],[k,R],[-k,R],[-k,k],[-R,k],[-R,-k],[-k,-k]].map(p=>[(p[0]-p[1])*q,(p[0]+p[1])*q]))}
  }return ''}

  h+='<div class="card"><h3>Lots & farmer clusters · లాట్లు</h3>'+tbl(['Consignment','Qty (kg)','Lots','Σ lots (kg)','Check'],c.map(x=>{const s=sum((x.lots||[]).map(l=>Number(l.kg)||0));const d=Math.abs(s-Number(x.qty||0));return [esc(x.conNo),fmtN(x.qty),(x.lots||[]).map(l=>'<div class="xs">'+esc(l.farmer)+' · '+fmtN(l.kg)+' kg</div>').join('')||'—',fmtN(s),d<=Number(x.qty||0)*.5?'<span class="chip ok xs">OK</span>':'<span class="chip warn xs">lots ≠ qty</span>']}))+'<div class="note xs">రైతులు వ్యక్తిగతంగా కాకుండా <b>సమూహం/క్లస్టర్</b> పేరుతో మాత్రమే (గోప్యత).</div></div>';return h}

/* ---------- alerts + @mentions ---------- */
function alertsOf(u){
  const out=[];const c=cfilter(u);const T=TODAY();
  c.forEach(x=>{const cx=cxOf(x),n=conStage(x),g=GATES[n-1];
    if(isLate(x))out.push({sev:'bad',x,t:'ఆలస్యం: ETA '+fmtDate(x.eta)+' దాటింది (దశ '+n+')'});
    const dd=stageDays(x);if(dd!=null&&n<12&&dd>g.sla)out.push({sev:'warn',x,t:'SLA మించింది: దశ '+n+' లో '+dd+' రోజులు (SLA '+g.sla+')'});
    chkFor(x.product).forEach(t=>{if(DOCSTG[t]<=n&&!hasTag(cx,t)&&!(DOCSTG[t]===n&&n<12&&false))out.push({sev:'warn',x,t:'పత్రం లేదు: '+t+' (దశ '+DOCSTG[t]+')'})});
    if(n>=11&&!Number((cx.fin||{}).recv)&&n<12)out.push({sev:'warn',x,t:'చెల్లింపు వసూలు పెండింగ్'});
    (cx.share||[]).forEach(s=>{if(s.rev)return;if(s.exp<T)out.push({sev:'warn',x,t:'Share గడువు ముగిసింది: '+s.to+' — revoke చేయండి'});else if(daysBetween(T,s.exp)<=7)out.push({sev:'',x,t:'Share 7 రోజుల్లో ముగుస్తుంది: '+s.to})})});
  return out}
function alertsView(u){
  const al=alertsOf(u);const c=cfilter(u);const men=[];c.forEach(x=>(cxOf(x).comments||[]).forEach(cm=>{if((cm.men||[]).includes(u.username)||isSuper(u))men.push({x,cm})}));
  let h=filterBar(u)+'<div class="grid g4 kp">'+kpi(cnt(al,a=>a.sev==='bad'),'Critical · ఆలస్యం',cnt(al,a=>a.sev==='bad')?'bad':'ok')+kpi(cnt(al,a=>a.sev==='warn'),'Warnings · హెచ్చరికలు',cnt(al,a=>a.sev==='warn')?'warn':'ok')+kpi(men.length,'@mentions')+kpi(al.length,'Total alerts')+'</div>';
  h+='<div class="card"><h3>Alerts · హెచ్చరికలు</h3>'+(al.length?tbl(['Consignment','Alert'],al.slice(0,60).map(a=>['<a href="#" data-act="v3-open" data-id="'+a.x.id+'">'+esc(a.x.conNo)+'</a>','<span class="chip '+a.sev+' xs">'+esc(a.t)+'</span>'])):'<div class="muted">హెచ్చరికలు లేవు.</div>')+'</div>';
  h+='<div class="card"><h3>Comments & @mentions</h3><form data-form="v3cm" class="grid g3"><label class="fl">Consignment<select name="id">'+c.map(x=>'<option value="'+x.id+'">'+esc(x.conNo)+'</option>').join('')+'</select></label><label class="fl" style="grid-column:span 2">Comment (@username తో ట్యాగ్)<input name="text" required maxlength="400" placeholder="@entry1 పత్రాలు చూడండి"></label><div class="err" id="v3cmerr"></div><div><button class="btn primary" type="submit">'+ico('check')+' Post</button></div></form>'+(men.length?tbl(['Consignment','From','Comment','When'],men.slice(-20).reverse().map(m=>['<a href="#" data-act="v3-open" data-id="'+m.x.id+'">'+esc(m.x.conNo)+'</a>',esc(m.cm.un||''),esc(m.cm.text),esc(fmtStamp(m.cm.t))])):'<div class="muted sm">మీకు @mentions లేవు.</div>')+'</div>';return h}
FRM.v3cm=async f0=>{const f=new FormData(f0);const u=ME();const r=regAll('cons').find(x=>x.id===f.get('id'));const er=$('#v3cmerr');if(!r||!regCanEdit(u,REGDEFS.cons,r)){er.textContent='అనుమతి లేదు';return}const text=String(f.get('text')||'').trim();if(!text)return;if(aadhaarLike(text)){er.textContent=AAD_MSG;return}
  const men=uniq((text.match(/@([a-z0-9_]+)/gi)||[]).map(x=>x.slice(1).toLowerCase()));const bad=men.filter(m=>!S.users.some(x=>x.username===m&&x.active));if(bad.length){er.textContent='తెలియని వినియోగదారు: @'+bad.join(', @');return}
  const cx=cxOf(r);cx.comments=cx.comments||[];cx.comments.push({id:'cm-'+Date.now(),by:u.id,un:u.name,t:nowStamp(),text,men});await cxLog(r,u,'Comment',text.slice(0,80));toast('కామెంట్ పోస్ట్ అయింది'+(men.length?' · @'+men.join(', @')+' కి నోటిఫై':''),'ok');render()};

  MODSCR.cons={tabs:[{id:'board',te:'Board · 12 దశలు'},{id:'kan',te:'Kanban'},{id:'map',te:'Map & Trace · మ్యాప్'},{id:'docs',te:'Docs · పత్రాలు'},{id:'gates',te:'Gates & SLA'},{id:'pay',te:'Payments · LC · Lots'},{id:'alerts',te:'Alerts · @mentions',cnt:0},{id:'sum',te:'Summary · సారాంశం'},{id:'list',te:'List · జాబితా'}],view:(u,t)=>{

/* ---------- KYJ coin ledger ---------- */
const coinIss=id=>sum(V3().coins.filter(c=>c.kyj===id&&c.type==='issue').map(c=>c.amt)),coinRed=id=>sum(V3().coins.filter(c=>c.kyj===id&&c.type==='redeem').map(c=>c.amt));
const coinId=()=>'CO-'+String(V3().coins.length+1).padStart(4,'0');
function coinsView(u){
  const k=regVisible(u,REGDEFS.kyj);const v=V3();const ids=new Set(k.map(x=>x.id));const led=v.coins.filter(c=>ids.has(c.kyj));
  const iss=sum(led.filter(c=>c.type==='issue').map(c=>c.amt)),red=sum(led.filter(c=>c.type==='redeem').map(c=>c.amt));
  let h='<div class="grid g4 kp">'+kpi(fmtN(iss),'Issued · జారీ')+kpi(fmtN(red),'Redeemed · రీడీమ్')+kpi(fmtN(iss-red),'Outstanding · బాకీ','ok')+kpi(fmtN(KJ_TOTAL),'Max per farmer · గరిష్టం')+'</div>';
  h+='<div class="note xs">దశ coins: 500 / 1,000 / 1,500 / 1,500 / 2,000 / 2,000 / 1,500 / 2,500 = <b>'+fmtN(KJ_TOTAL)+'</b>. ఒక దశకు ఒక్కసారే జారీ; రైతు చేరిన journey దశ వరకే. <b>1 coin విలువ (₹) — మీ నిర్ణయం</b> (ఇంకా నిర్ణయించలేదు; ఇక్కడ విలువ చూపడం లేదు).</div>';
  h+='<div class="card"><h3>Balances · బ్యాలెన్స్</h3>'+tbl(['Farmer / group','Journey','Earned (rule)','Issued','Redeemed','Balance','To issue',''],k.map(x=>{const j=x.jstage===''||x.jstage==null?-1:Number(x.jstage);const earned=j>=1?coinsOf(j):0;const is=coinIss(x.id),rd=coinRed(x.id);const can=canManage(u);return [esc(x.farmer),j<0?'—':j,fmtN(earned),fmtN(is),fmtN(rd),'<b>'+fmtN(is-rd)+'</b>',earned-is>0?'<span class="chip warn xs">'+fmtN(earned-is)+'</span>':'<span class="chip ok xs">0</span>',can&&earned-is>0?'<button class="btn sm" data-act="v3-issue" data-id="'+x.id+'">Issue due</button>':'']}))+'</div>';
  if(canManage(u))h+='<div class="card"><h3>Redeem · రీడీమ్</h3><form data-form="v3redeem" class="grid g4"><label class="fl">Farmer / group<select name="id">'+k.map(x=>'<option value="'+x.id+'">'+esc(x.farmer)+' · bal '+fmtN(coinIss(x.id)-coinRed(x.id))+'</option>').join('')+'</select></label><label class="fl">Coins<input type="number" name="amt" min="1" step="1" required></label><label class="fl">Purpose<select name="ref"><option>Input purchase / ఇన్‌పుట్ కొనుగోలు</option><option>FEED Card offset</option><option>Training / శిక్షణ</option></select></label><div class="err" id="v3rerr"></div><div><button class="btn primary" type="submit">'+ico('check')+' Redeem</button></div></form></div>';
  h+='<div class="card"><h3>Ledger · లెడ్జర్ <span class="muted sm">· '+led.length+'</span></h3>'+tbl(['ID','Group','Type','Stage','Coins','Date','Ref'],led.slice().reverse().slice(0,40).map(c=>{const x=k.find(z=>z.id===c.kyj);return [c.id,esc(x?x.farmer:c.kyj),'<span class="chip '+(c.type==='issue'?'ok':'warn')+' xs">'+c.type+'</span>',c.stage==null?'—':c.stage,(c.type==='issue'?'+':'−')+fmtN(c.amt),esc(c.date),'<span class="xs">'+esc(c.ref||'')+'</span>']}))+'</div>';return h}
ACT['v3-issue']=el=>{const u=ME();const x=regAll('kyj').find(z=>z.id===el.dataset.id);if(!x||!canManage(u))return;const j=Number(x.jstage);let n=0;KJ.filter(s=>s.n>=1&&s.n<=j).forEach(s=>{if(!V3().coins.some(c=>c.kyj===x.id&&c.type==='issue'&&c.stage===s.n)){V3().coins.push({id:coinId(),kyj:x.id,stage:s.n,amt:s.c,type:'issue',date:TODAY(),ref:'Stage '+s.n,by:u.id});n+=s.c}});audit('Coins జారీ',x.id,n+'');save();toast(fmtN(n)+' coins జారీ అయ్యాయి','ok');render()};
FRM.v3redeem=f0=>{const f=new FormData(f0);const u=ME();const x=regAll('kyj').find(z=>z.id===f.get('id'));const er=$('#v3rerr');if(!x||!canManage(u))return;const a=Math.floor(Number(f.get('amt')));const bal=coinIss(x.id)-coinRed(x.id);
  if(!(a>=1)){er.textContent='సరైన సంఖ్య ఇవ్వండి';return}if(a>bal){er.textContent='బ్యాలెన్స్ ('+fmtN(bal)+') కంటే ఎక్కువ రీడీమ్ చేయలేరు';return}
  V3().coins.push({id:coinId(),kyj:x.id,stage:null,amt:a,type:'redeem',date:TODAY(),ref:String(f.get('ref')),by:u.id});audit('Coins రీడీమ్',x.id,a+'');save();toast('రీడీమ్ అయింది','ok');render()};
(function(){const old=MODSCR.kyj;MODSCR.kyj={tabs:old.tabs.slice(0,2).concat([{id:'coins',te:'Coins ledger · కాయిన్లు'}],old.tabs.slice(2)),view:(u,t)=>t==='coins'?coinsView(u):old.view(u,t)}})();

/* ---------- demo purge (also cleans consignment extras + IndexedDB blobs + V3 ledgers) ---------- */
ACT['demo-clear']=()=>{
  const me=ME();if(!isSuper(me))return;
  confirmBox('DEMO డేటా శాశ్వతంగా తొలగించబడుతుంది — stakeholders, మ్యాప్ చుక్కలు, buyers, consignments (ఫైళ్లతో సహా), సమ్మతి, coins. కొనసాగాలా?',()=>{
    const V=V2(),v=V3();const rid=new Set(S.recs.filter(r=>r.demo).map(r=>r.id));const dcons=new Set(regAll('cons').filter(x=>x.demo).map(x=>x.id));
    dcons.forEach(id=>{const cx=V.cx[id];if(cx)(cx.files||[]).forEach(f=>{try{IDB.del(f.id)}catch(e){}});delete V.cx[id]});
    S.recs=S.recs.filter(r=>!r.demo);S.tasks=S.tasks.filter(t=>!t.demo);S.issues=S.issues.filter(i=>!i.demo);S.batches=[];REGKEYS.forEach(k=>{S.reg[k]=regAll(k).filter(x=>!x.demo)});
    const live=new Set(regAll('cons').map(x=>x.id));Object.keys(V.cx).forEach(id=>{if(!live.has(id)){(V.cx[id].files||[]).forEach(f=>{try{IDB.del(f.id)}catch(e){}});delete V.cx[id]}});
    v.consent=v.consent.filter(c=>!rid.has(c.rid));Object.keys(v.ids).forEach(k=>{if(rid.has(k))delete v.ids[k]});Object.keys(v.idst).forEach(k=>{if(rid.has(k))delete v.idst[k]});v.clusters=v.clusters.filter(c=>!c.demo);v.coins=v.coins.filter(c=>!c.demo);v.ov=v.ov.filter(o=>live.has(o.cid));v.dedupe=[];v.seeded=true;
    const keep=S.users.filter(x=>!x.demo||x.id===me.id);S.users=keep;S.users.forEach(x=>{x.divs=(x.divs||[]).slice()});S.recs.forEach(r=>{if(!userById(r.owner))r.owner=me.id});
    S.audit=[];S.seq.audit=0;audit('డెమో డేటా తొలగింపు','','అన్ని డెమో రికార్డులు, consignments, ఫైళ్లు, సమ్మతి, coins తొలగించబడ్డాయి');
    toast('డెమో డేటా తొలగించబడింది','ok');go('home')},{danger:true,ok:'తొలగించు'});
};
